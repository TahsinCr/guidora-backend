name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: guidora_test
          POSTGRES_USER: guidora
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guidora -d guidora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.6-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guidora
          RABBITMQ_DEFAULT_PASS: ci-rabbit-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Install EF tooling
        run: dotnet tool install --global dotnet-ef --version 10.0.4
      - name: Restore backend layers
        run: dotnet restore NetCoreBackend.sln
      - name: Fail on moderate or higher NuGet vulnerabilities
        run: dotnet restore NetCoreBackend.sln -p:NuGetAudit=true -p:NuGetAuditLevel=moderate -warnaserror:NU1902,NU1903,NU1904 --force
      - name: Build backend layers
        run: dotnet build NetCoreBackend.sln --configuration Release --no-restore
      - name: Start Redis with production cache policy
        run: >-
          docker run --detach --name guidora-ci-redis --publish 6379:6379
          redis:8.10.1-alpine3.23 redis-server --maxmemory 256mb
          --maxmemory-policy volatile-lfu --appendonly no --save ""
      - name: Wait for Redis readiness
        run: |
          for attempt in $(seq 1 30); do
            if docker exec guidora-ci-redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          docker logs guidora-ci-redis
          exit 1
      - name: Apply schema to isolated CI database
        env:
          ConnectionStrings__Guidora: Host=localhost;Port=5432;Database=guidora_test;Username=guidora;Password=ci-postgres-password
        run: dotnet ef database update --project DataAccess --startup-project WebAPI --configuration Release
      - name: Run all tests, including infrastructure integration tests
        env:
          GUIDORA_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=guidora_test;Username=guidora;Password=ci-postgres-password
          GUIDORA_TEST_REDIS_CONFIGURATION: localhost:6379
          GUIDORA_TEST_RABBITMQ_HOST: localhost
          GUIDORA_TEST_RABBITMQ_PORT: 5672
          GUIDORA_TEST_RABBITMQ_USERNAME: guidora
          GUIDORA_TEST_RABBITMQ_PASSWORD: ci-rabbit-password
        run: dotnet test Tests/Tests.csproj --configuration Release --no-build
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build backend image
        run: docker build --tag guidora-backend:ci .
      - name: Smoke test non-root backend runtime
        run: |
          docker run --detach --name guidora-ci-backend --publish 18080:8080 \
            --env TokenOptions__SecurityKey=ci-only-signing-key-at-least-thirty-two-bytes \
            --env CommunityVerification__SignalHashKey=ci-only-signal-key-at-least-thirty-two-bytes \
            guidora-backend:ci
          test "$(docker exec guidora-ci-backend id -u)" != 0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs guidora-ci-backend
          exit 1
